name: discover

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discover-main
  cancel-in-progress: false

jobs:
  update-registries:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate PHP syntax
        run: |
          php -l src/lib.php
          php -l src/discover.php

          for schema in db/schema/*.php; do
            php -l "$schema"
          done

      - name: Discover schemas, entries, and Markdown files
        run: php src/discover.php

      - name: Validate generated registries
        run: |
          php -l build/schema.php
          php -l build/entries.php
          php -l build/markdowns.php
          php -r 'json_decode(file_get_contents("statistics.json"), true, 512, JSON_THROW_ON_ERROR);'
          git diff --check

      - name: Commit changes if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/schema.php build/entries.php build/markdowns.php statistics.json
          if [ -d dist ]; then
            git add dist
          fi

          if git diff --cached --quiet; then
            echo "Registries are already up to date."
            exit 0
          fi

          git commit -m "Update generated registries"
          git push origin HEAD:main
