name: discover

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discover-main
  cancel-in-progress: false

jobs:
  update-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate PHP syntax
        run: |
          php -l src/lib.php
          php -l src/discover.php

          for schema in db/schema/*.php; do
            php -l "$schema"
          done

      - name: Discover schemas
        run: php src/discover.php

      - name: Validate generated registry
        run: |
          php -l build/schema.php
          git diff --check

      - name: Commit changes if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/schema.php

          if git diff --cached --quiet; then
            echo "Schema registry is already up to date."
            exit 0
          fi

          git commit -m "Update schema registry"
          git push origin HEAD:main
